[package]
name = "casa"
version = "1.0.0"
description = "CASA - Cyber Moon Rabbit Desktop Music Player"
authors = ["Farhan Pratama"]
edition = "2021"

[lib]
name = "casa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "sync", "net", "io-util"] }
reqwest = { version = "0.13", features = ["json"] }
tauri-plugin-drag = "2.1.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
] }
windows = { version = "0.62", features = [
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Power",
    "Win32_System_Wmi",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_UI_Shell",
] }
windows-core = "0.62"
base64 = "0.22"
